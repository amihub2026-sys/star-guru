<div class="admin-login-page">

  <div class="login-bg-shape shape-one"></div>
  <div class="login-bg-shape shape-two"></div>

  <div class="login-card">

    <div class="login-brand">
      <div class="brand-mark">
        SG
      </div>

      <div>
        <h1>STAR GURU</h1>
        <p>ADMIN PANEL</p>
      </div>
    </div>

    <div class="login-heading">
      <span class="login-kicker">
        SECURE ACCESS
      </span>

      <h2>
        Welcome Back
      </h2>

      <p>
        Sign in to manage your website,
        forms, news, gallery and other
        admin content.
      </p>
    </div>


    <div
      *ngIf="errorMessage"
      class="login-message error-message"
    >
      {{ errorMessage }}
    </div>


    <div
      *ngIf="successMessage"
      class="login-message success-message"
    >
      {{ successMessage }}
    </div>


    <form
      class="login-form"
      (ngSubmit)="login()"
    >

      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <div class="input-wrapper">

          <span class="input-icon">
            @
          </span>

          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="admin@starguru.org"
            autocomplete="email"
            [disabled]="loading"
          >

        </div>

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <div class="input-wrapper password-wrapper">

          <span class="input-icon">
            ●
          </span>

          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            [disabled]="loading"
          >

          <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
            [disabled]="loading"
          >
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>

        </div>

      </div>


      <button
        type="submit"
        class="login-btn"
        [disabled]="loading"
      >

        <span *ngIf="!loading">
          Login to Admin
        </span>

        <span
          *ngIf="loading"
          class="loading-content"
        >
          <span class="spinner"></span>
          Signing In...
        </span>

      </button>

    </form>


    <div class="login-footer">
      <span class="security-dot"></span>
      Secure Star Guru Administration
    </div>

  </div>

</div>
